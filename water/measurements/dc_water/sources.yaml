sources:
  - id: dc_water_ccr
    title: "Drinking Water Quality Report"
    index_url: "https://www.dcwater.com/waterreport"
    content: "Annual drinking water quality report and compliance monitoring results for the District of Columbia."
    cadence: annual
    cadence_basis:
      rule:
        citation: "40 CFR § 141.152(b)"
        quoted_sentence: "Each existing community water system must deliver reports according to § 141.155 by July 1 each year."
    active: true
    issue_pattern: "(?:{period}[-_ ]*(?:ccr|water[-_ ]*quality[-_ ]*report)|(?:ccr|water[-_ ]*quality[-_ ]*report)[-_ ]*{period})"
    expected_by: "July 1 annually following compliance reporting period"
    grace_days: 30
    last_found:
      title: "2026 Drinking Water Quality Report"
      url: "https://www.dcwater.com/sites/default/files/document/2026-06/documents/2026_CCR_6.11.26_FINAL.pdf"
      sha256: "00d4f6197b744fac344b5466f36fa81cb4491cf0916a4125a2f201fb604ef336"
